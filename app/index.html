<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统监控</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Microsoft YaHei UI', sans-serif;
  width: 280px; height: 330px;
  display: flex; flex-direction: column;
  overflow: hidden;
  border-radius: 16px;
  background: transparent;
  -webkit-app-region: drag;
}

.container {
  flex: 1;
  background: rgba(17, 17, 34, 0.45);
  backdrop-filter: blur(28px) saturate(1.5);
  -webkit-backdrop-filter: blur(28px) saturate(1.5);
  border-radius: 16px;
  padding: 28px 12px 8px;
  position: relative;
}

.drag-handle {
  position: absolute;
  top: 0; left: 30px; right: 30px;
  height: 28px;
  -webkit-app-region: drag;
  z-index: 10;
}

.close-btn {
  position: absolute;
  top: 8px; left: 8px;
  width: 20px; height: 20px;
  background: rgba(255, 255, 255, 0.07);
  border: none;
  border-radius: 50%;
  color: rgba(255, 255, 255, 0.5);
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-app-region: no-drag;
  z-index: 20;
  transition: background 0.2s;
}
.close-btn:hover { background: rgba(255, 80, 80, 0.6); color: #fff; }

.auto-start-btn {
  position: absolute;
  top: 8px; left: 32px;
  width: 20px; height: 20px;
  background: rgba(255, 255, 255, 0.07);
  border: none;
  border-radius: 50%;
  color: rgba(255, 255, 255, 0.5);
  font-size: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-app-region: no-drag;
  z-index: 20;
  transition: background 0.2s;
}
.auto-start-btn:hover { background: rgba(255, 255, 255, 0.15); }
.auto-start-btn.active { background: rgba(0, 210, 255, 0.3); color: #00d2ff; }

.pin-btn {
  position: absolute;
  top: 8px; left: 56px;
  width: 20px; height: 20px;
  background: rgba(255, 255, 255, 0.07);
  border: none;
  border-radius: 50%;
  color: rgba(255, 255, 255, 0.5);
  font-size: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-app-region: no-drag;
  z-index: 20;
  transition: background 0.2s;
}
.pin-btn:hover { background: rgba(255, 255, 255, 0.15); }
.pin-btn.active { background: rgba(0, 210, 255, 0.3); color: #00d2ff; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 10px;
  width: 100%;
  height: 100%;
}

.gauge {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.ring {
  position: relative;
  width: 100px;
  height: 100px;
}

.ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.ring .bg {
  fill: none;
  stroke: rgba(255, 255, 255, 0.08);
  stroke-width: 10;
}

.ring .fg {
  fill: none;
  stroke-width: 10;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.3s ease;
}

.ring .center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.ring .pct {
  font-size: 22px;
  font-weight: bold;
  line-height: 1;
}

.ring .label {
  font-size: 10px;
  font-weight: bold;
  margin-top: 4px;
  opacity: 0.8;
}

.ring .sub {
  font-size: 9px;
  font-weight: bold;
  margin-top: 2px;
  opacity: 0.55;
}

.cpu-color { color: #00d2ff; }
.cpu-color .fg { stroke: #00d2ff; }
.gpu-color { color: #ff6ad5; }
.gpu-color .fg { stroke: #ff6ad5; }
.mem-color { color: #00e676; }
.mem-color .fg { stroke: #00e676; }
.disk-color { color: #ffd93d; }
.disk-color .fg { stroke: #ffd93d; }
.net-color { color: #ffffff; }
.net-color .fg { stroke: #ffffff; }

.net-gauge {
  position: absolute;
  top: 53%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;
}
.net-gauge .ring { width: 100px; height: 100px; }
.net-gauge .ring .bg { stroke: rgba(255,255,255,0.05); }
.net-gauge .ring .pct { font-size: 18px; }
.net-gauge .ring .label { font-size: 9px; }
.net-gauge .ring .sub { font-size: 8px; margin-top: 2px; }
</style>
</head>
<body>
<div class="container">
  <div class="drag-handle"></div>
  <button class="close-btn" onclick="window.electronAPI.closeWidget()">&#10005;</button>
  <button class="auto-start-btn" id="autoStartBtn" onclick="toggleAutoStart()" title="开机自启">&#9654;</button>
  <button class="pin-btn" id="pinBtn" onclick="togglePin()" title="窗口置顶">&#x1F4CC;</button>

  <div class="grid">
    <div class="gauge" id="gauge-cpu">
      <div class="ring cpu-color">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="42"/>
          <circle class="fg" id="cpu-fg" cx="50" cy="50" r="42"
                  stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
        </svg>
        <div class="center">
          <div class="pct" id="cpu-pct">0%</div>
          <div class="label">CPU</div>
          <div class="sub" id="cpu-sub"></div>
        </div>
      </div>
    </div>

    <div class="gauge" id="gauge-gpu">
      <div class="ring gpu-color">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="42"/>
          <circle class="fg" id="gpu-fg" cx="50" cy="50" r="42"
                  stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
        </svg>
        <div class="center">
          <div class="pct" id="gpu-pct">0%</div>
          <div class="label" id="gpu-label">GPU</div>
          <div class="sub" id="gpu-sub"></div>
        </div>
      </div>
    </div>

    <div class="gauge" id="gauge-mem">
      <div class="ring mem-color">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="42"/>
          <circle class="fg" id="mem-fg" cx="50" cy="50" r="42"
                  stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
        </svg>
        <div class="center">
          <div class="pct" id="mem-pct">0%</div>
          <div class="label">MEM</div>
        </div>
      </div>
    </div>

    <div class="gauge" id="gauge-disk">
      <div class="ring disk-color">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="42"/>
          <circle class="fg" id="disk-fg" cx="50" cy="50" r="42"
                  stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
        </svg>
        <div class="center">
          <div class="pct" id="disk-pct">0%</div>
          <div class="label">DISK</div>
          <div class="sub" id="disk-sub"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="net-gauge">
    <div class="ring net-color">
      <svg viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="42"/>
        <circle class="fg" id="net-fg" cx="50" cy="50" r="42"
                stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
      </svg>
      <div class="center">
        <div class="pct" id="net-pct">0%</div>
        <div class="label">NET</div>
        <div class="sub" id="net-sub"></div>
      </div>
    </div>
  </div>
</div>

<script>
const circumference = 2 * Math.PI * 42;
let autoStartEnabled = false;
let pinEnabled = false;

function setGauge(id, pct) {
  const el = document.getElementById(id);
  const offset = circumference * (1 - pct / 100);
  el.setAttribute('stroke-dashoffset', offset);
}

async function toggleAutoStart() {
  autoStartEnabled = !autoStartEnabled;
  const btn = document.getElementById('autoStartBtn');
  btn.classList.toggle('active', autoStartEnabled);
  await window.electronAPI.setAutoStart(autoStartEnabled);
}

async function togglePin() {
  pinEnabled = !pinEnabled;
  const btn = document.getElementById('pinBtn');
  btn.classList.toggle('active', pinEnabled);
  await window.electronAPI.setAlwaysOnTop(pinEnabled);
}

async function initAutoStart() {
  const btn = document.getElementById('autoStartBtn');
  autoStartEnabled = await window.electronAPI.getAutoStart();
  btn.classList.toggle('active', autoStartEnabled);
}

async function initPin() {
  const btn = document.getElementById('pinBtn');
  pinEnabled = await window.electronAPI.getAlwaysOnTop();
  btn.classList.toggle('active', pinEnabled);
}

initAutoStart();
initPin();

window.electronAPI.onSystemData((data) => {
  document.getElementById('cpu-pct').textContent = data.cpu + '%';
  setGauge('cpu-fg', data.cpu);
  if (data.cpuFreq) {
    let sub = '';
    if (data.cpuVoltage != null) sub += data.cpuVoltage.toFixed(2) + 'V ';
    sub += data.cpuFreq.toFixed(1) + 'GHz';
    if (data.cpuTemp != null) sub += ' ' + data.cpuTemp.toFixed(0) + '°C';
    document.getElementById('cpu-sub').textContent = sub;
  }

  document.getElementById('gpu-pct').textContent = Math.round(data.gpu) + '%';
  setGauge('gpu-fg', data.gpu);
  let gpuLabel = 'GPU';
  if (data.gpuTemp != null) gpuLabel += ' ' + data.gpuTemp.toFixed(0) + '°C';
  document.getElementById('gpu-label').textContent = gpuLabel;
  if (data.gpuMem) {
    let memText = data.gpuMem.used.toFixed(0) + 'MB';
    if (data.gpuMem.total) memText += '/' + data.gpuMem.total.toFixed(0) + 'MB';
    document.getElementById('gpu-sub').textContent = memText;
  }

  document.getElementById('mem-pct').textContent = data.mem + '%';
  setGauge('mem-fg', data.mem);

  document.getElementById('disk-pct').textContent = data.disk + '%';
  setGauge('disk-fg', data.disk);
  if (data.diskIO) {
    document.getElementById('disk-sub').textContent =
      'R:' + data.diskIO.read.toFixed(1) + ' W:' + data.diskIO.write.toFixed(1) + ' MB/s';
  }

  if (data.net) {
    document.getElementById('net-pct').textContent = Math.round(data.net.pct) + '%';
    setGauge('net-fg', data.net.pct);
    document.getElementById('net-sub').textContent =
      '↓' + data.net.down.toFixed(1) + ' ↑' + data.net.up.toFixed(1) + ' Mbps';
  }
});
</script>
</body>
</html>
